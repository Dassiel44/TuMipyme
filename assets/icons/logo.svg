  <rect x="352" y="72" width="40" height="48" rx="8" fill="white" opacity="0.8"/>
  <!-- Cajas en el estante inferior -->
  <rect x="120" y="200" width="64" height="60" rx="8" fill="url(#accent)" opacity="0.9"/>
  <rect x="200" y="216" width="48" height="44" rx="8" fill="white" opacity="0.85"/>
