<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F4C81"/>
      <stop offset="100%" style="stop-color:#2A9D8F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#E55A5A"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- Estante superior -->
  <rect x="120" y="120" width="272" height="24" rx="6" fill="white" opacity="0.95"/>
  <!-- Estante inferior -->
  <rect x="100" y="260" width="312" height="24" rx="6" fill="white" opacity="0.95"/>
  <!-- Base -->
  <rect x="80" y="370" width="352" height="24" rx="6" fill="white" opacity="0.95"/>
  <!-- Cajas en el estante superior -->
  <rect x="136" y="80" width="56" height="40" rx="8" fill="white" opacity="0.9"/>
  <rect x="208" y="64" width="56" height="56" rx="8" fill="white" opacity="0.85"/>
